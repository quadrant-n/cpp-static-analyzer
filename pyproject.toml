[project]
name = "cpp-static-analyzer"
version = "0.0.1"
description = "C/C++ static analyzer using clang-tidy and clang static analyzer."
authors = [{name = "Stefanus Nanami", email = "stefanus-nanami@capcom.com"}]
license = {file = "LICENSE"}
readme = "README.md"
package-mode = true
keywords = ["static", "analyzer", "C++", "clang-tidy", "clang static analyzer", "C"]

[tool.poetry.urls]
"Issues" = "https://github.com/quadrant-n/cpp-static-analyzer/issues"
"Repository" = "https://github.com/quadrant-n/cpp-static-analyzer"
"Documentation" = "https://github.com/quadrant-n/cpp-static-analyzer/wiki"

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
flake8 = "^7.1.1"
pylint = "^3.2.7"
mypy = "^1.15.0"
pyright = "^1.1.394"
pytest-cov = "^6.1.1"

[tool.poetry.scripts]
cpp-static-analyzer = "cpp_static_analyzer:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportArgumentType = false
